<!DOCTYPE html>
<html>
<head><title>Test</title></head>
<body>
<div id="test"><h2>1. 代码语法高亮</h2>
<pre><code class="language-javascript">console.log('hello');</code></pre>
<h2>2. 图片点击放大</h2>
<p>Some text</p></div>
<pre id="output"></pre>
<script>
var root = document.getElementById('test');
var h2 = root.querySelector('h2');
document.getElementById('output').textContent = 'h2 children count: ' + h2.children.length + ', h2 innerHTML: ' + h2.innerHTML.substring(0, 200);
</script>
</body>
</html>
