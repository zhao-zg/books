    <script>(function(){var d=document.documentElement,m=document.querySelector('meta[name="theme-color"]'),s=null,t='cool';try{s=localStorage.getItem('readingTheme')}catch(e){}if(s==='cool'||s==='warm'||s==='dark'){t=s}d.setAttribute('data-theme',t);if(m){m.setAttribute('content',t==='warm'?'#F7F2E8':(t==='dark'?'#1A1917':'#F5F4F1'));}})();</script>
    <!-- 防止阅读字号闪烁：在渲染前设置 --reading-font-size -->
    <script>(function(){try{var s=localStorage.getItem('globalFontSize');if(s){var v=parseFloat(s);if(v>=10&&v<=30)document.documentElement.style.setProperty('--reading-font-size',v+'px');}}catch(e){}})();</script>
    <!-- 伪装/访问控制：可配置，默认关闭（普通浏览器直接可用） -->
    <script>
    (function(){
      // 应用配置（前端同步可读；构建时可由 config.yaml 注入覆盖 window.BK_CONFIG）
      window.BK_CONFIG = window.BK_CONFIG || { disguiseEnabled: true };
      // 是否启用伪装：默认关闭；URL 带 ?disguise=1 可临时开启自测
      var ENABLED = window.BK_CONFIG.disguiseEnabled === true
        || window.location.search.indexOf('disguise=1') !== -1;
      if (!ENABLED) return; // 默认不启用伪装，保留代码以备将来开启

      var ok=false;
      try{if(sessionStorage.getItem('bk_access')==='ok')ok=true;}catch(e){}
      if(!ok&&window.location.search.indexOf('zzg')!==-1){try{sessionStorage.setItem('bk_access','ok');}catch(e){}ok=true;}
      if(!ok&&window.location.hash&&window.location.hash.length>2){ok=true;}
      if(!ok){
        var isCap=window.Capacitor!==undefined||window.location.protocol==='capacitor:'||window.location.hostname==='localhost';
        var isPwa=window.navigator.standalone===true||(window.matchMedia&&window.matchMedia('(display-mode: standalone)').matches);
        if(!isCap&&!isPwa)document.documentElement.classList.add('bk-disguise');
      }
    })();
    </script>

    <div id="bkSplash">
        <div class="bk-splash-icon">📖</div>

        <div class="bk-splash-sub">电子书阅读应用</div>
    </div>
    <script>(function(){
        var _splashDone=false;
        var _windowLoaded=false;
        var _dataReady=false;
        var _pageRendered=false;
        function _dismissSplash(){
            if(_splashDone)return;_splashDone=true;
            var el=document.getElementById('bkSplash');
            if(!el)return;
            el.classList.add('bk-splash-out');
            setTimeout(function(){if(el&&el.parentNode)el.parentNode.removeChild(el);},480);
        }
        function _checkDismiss(){
            if(_splashDone)return;
            // 数据就绪 + 首页渲染完成 → 才消失（避免加载页早于内容消失导致闪白）
            if(_dataReady&&_pageRendered&&_windowLoaded) _dismissSplash();
        }
        // 等 window.load
        if(document.readyState==='complete'){_windowLoaded=true;} 
        else window.addEventListener('load',function(){_windowLoaded=true;_checkDismiss();});
        // 等数据就绪
        if(window._bkDataReady){
            window._bkDataReady.then(function(){_dataReady=true;_checkDismiss();}).catch(function(){_dataReady=true;_checkDismiss();});
        } else {_dataReady=true;}
        // 等首屏页面渲染完成（renderer 派发 bk-page-rendered 事件）
        document.addEventListener('bk-page-rendered',function(){
            _pageRendered=true;_checkDismiss();
        },{once:true});
        // 兜底：最多等 6 秒
        setTimeout(_dismissSplash,6000);
        // 供 renderer.js 数据就绪后调用
        window.bkDismissSplash=_dismissSplash;
    })();</script>

    // ── 页面记忆：恢复（APP / PWA 内） ──────────────────────────────────
    (function(){
        try{
            var isApp=BK_ENV.isInApp||BK_ENV.isCapacitorApp;
            if(!isApp){ console.log('[页面记忆] 非 App/PWA，跳过恢复'); return; }
            var hasRestored=sessionStorage.getItem('bk_has_restored');
            var curHash=window.location.hash;
            var curHashIsMain=!curHash||curHash==='#'||curHash==='#/';
            console.log('[页面记忆] isApp=true hasRestored=' + hasRestored + ' curHash="' + curHash + '" curHashIsMain=' + curHashIsMain);
            if(hasRestored||!curHashIsMain){
                sessionStorage.setItem('bk_has_restored','true');
                console.log('[页面记忆] 已恢复或当前非主页，直接 initHomePage');
                if(window.BKNavStack)window.BKNavStack.initHomePage();
                return;
            }
            var lastPage=localStorage.getItem('bk_last_page');
            var lastPageTime=localStorage.getItem('bk_last_page_time');
            console.log('[页面记忆] lastPage=' + lastPage);
            if(lastPage&&lastPageTime){
                var timeDiff=Date.now()-parseInt(lastPageTime);
                if(timeDiff<7*24*60*60*1000){
                    var lastHash='';
                    try{lastHash=new URL(lastPage).hash;}catch(e){}
                    var lastPageIsMain=!lastHash||lastHash==='#'||lastHash==='#/';
                    console.log('[页面记忆] lastHash="' + lastHash + '" lastPageIsMain=' + lastPageIsMain + ' timeDiff=' + timeDiff);
                    if(!lastPageIsMain){
                        // ★ 一致性校验：bk_last_page 与 bk_last_route 不一致时，优先信任 bk_last_route
                        //   bk_last_route 在每次 dispatch 时同步保存，比 bk_last_page（仅在
                        //   visibilitychange/beforeunload 时保存）更可靠。
                        //   场景：旧版本数据 bk_last_page 仍为阅读页 URL，但 bk_last_route
                        //   已正确记录为 shelf → bk_last_page 过时，应恢复到书架。
                        var savedRoute='';
                        try{savedRoute=localStorage.getItem('bk_last_route')||'';}catch(e){}
                        if(savedRoute){
                            var savedFirstSeg=savedRoute.split('/')[0];
                            if(savedFirstSeg==='shelf'||savedFirstSeg==='my'||savedFirstSeg==='me'){
                                console.log('[页面记忆] bk_last_page 过时（"'+lastHash+'"），bk_last_route="'+savedRoute+'" 在主页，优先恢复书架');
                                lastHash='#/shelf';
                            }
                        }
                        // ★ 降级：最后记忆是"我的"页面时，恢复到书架而非"我的"
                        var routePart = lastHash.replace(/^#\/?/, '').split('/')[0];
                        if (routePart === 'my' || routePart === 'me') {
                            console.log('[页面记忆] 最后页面是"我的"，降级恢复至书架');
                            lastHash = '#/shelf';
                        }
                        sessionStorage.setItem('bk_has_restored','true');
                        sessionStorage.setItem('bk_restore_scroll','true');
                        if(window.BK&&window.BK.backStack&&window.BK.backStack.skipNext)window.BK.backStack.skipNext();
                        console.log('[页面记忆] 恢复至 lastHash="' + lastHash + '"');
                        window.location.hash=lastHash;
                        if(window.BKNavStack)window.BKNavStack.initHomePage();
                        return;
                    }

    function getBookResources(path){
        return ['./' + path + '/book.json'];
    }

    function waitForBooks(timeout){
        return new Promise(function(resolve,reject){
            if(window.__bkBooks&&window.__bkBooks.length){resolve(window.__bkBooks);return;}
            var e=0,iv=setInterval(function(){
                if(window.__bkBooks&&window.__bkBooks.length){clearInterval(iv);resolve(window.__bkBooks);}
                else{e+=100;if(e>=timeout){clearInterval(iv);reject(new Error('超时'));}}
            },100);
        });
    }

    function verifyCacheIntegrity(targetVersion){
        if(!('caches' in window))return Promise.resolve({ok:false,coverage:0,missingCore:0,missingCoreUrls:[]});
        var coreUrls=window.__bkCoreUrls||[];
        // SW 全局 caches.match() 跨桶搜索：bk-main（运行时缓存）+ bk-data-{version}（安装桶）
        var checkUrls=coreUrls.filter(function(u){return u!=='./';});
        return Promise.all(checkUrls.map(function(u){
            return caches.match(u).then(function(r){return r?null:u;});
        })).then(function(results){
            var missingUrls=results.filter(Boolean);
            var hits=checkUrls.length-missingUrls.length;
            var cov=checkUrls.length>0?hits/checkUrls.length:1;
            return{ok:cov>=1,coverage:cov,missingCore:missingUrls.length,missingCoreUrls:missingUrls};
        }).catch(function(){return{ok:false,coverage:0,missingCore:0,missingCoreUrls:[]};});
    }

    // ── PWA 缓存管理（数据缓存版本化，切换桶更新）─────────────────────────
    // 数据缓存桶名带版本号：bk-data-{version}，每次更新写新桶，成功后删旧桶。
    // SW 全局 caches.match() 自动跨桶搜索，切换桶后离线请求自然命中新桶。
    // SW 不参与数据桶管理——activate 零清理，只做 clients.claim()。
    // 静态资源运行时缓存走 bk-main（固定名，cache.put 覆盖更新）。
    window.BK.pwaCache = (function(){
        var LS_VERSION = 'bk_pwa_version';
        var LS_BUCKET = 'bk_pwa_bucket';   // 记录当前数据桶名
        var root = './';

        function dataCacheName(ver){ return 'bk-data-' + ver; }

        // 全量缓存文件列表（books 的核心 URL 已包含数据索引 books-index.json / manifest.json）
        function buildUrlList(){
            return (window.__bkCoreUrls || []).slice();
        }

        // 缓存全部 URL 到指定桶，返回 Promise<{ok,total,failed}>
        // 采用分片并发（CONCURRENCY=6）逐片 fetch：相比一次性 Promise.allSettled，
        // 进度条能按"已完成片数/总片数"平滑递增，而非瞬间冲到接近 100%。
        // 每片完成后上报 onProgress(ratio, done, total)：
        //   ratio = (当前片内完成数 + 已提交片数) / 总片数
        //   done  = 已完成 URL 数（含本片内），total = 总片数
        function cacheFullInto(cacheName, onProgress) {
            if(!('caches' in window)) return Promise.resolve({ok:0,total:0,failed:0});
            var urls = buildUrlList();
            var total = urls.length;
            if(total === 0){ if(onProgress) onProgress(1, 0, 0); return Promise.resolve({ok:0,total:0,failed:0}); }
            var CONCURRENCY = 6;
            var done = 0, failed = 0;
            return caches.open(cacheName).then(function(cache){
                // 逐片调度：一次最多 CONCURRENCY 个在途，全部完成后再取下一片
                var index = 0;
                function nextChunk(){
                    if(index >= total) return Promise.resolve();
                    var slice = urls.slice(index, index + CONCURRENCY);
                    index += CONCURRENCY;
                    return Promise.all(slice.map(function(url){
                        return fetch(url, {cache:'no-cache'}).then(function(r){
                            if(r && r.status===200) return cache.put(url, r);
                            failed++;
                        }).catch(function(){
                            failed++;
                        }).then(function(){
                            done++;
                            if(onProgress) onProgress(done/total, done, total);
                        });
                    })).then(nextChunk); // 递归取下一片
                }
                return nextChunk();
            }).then(function(){
                return {ok: done - failed, total: total, failed: failed};
            });
        }

        // 删除所有旧版数据桶（保留 currentBucket）
        function deleteOldBuckets(currentBucket){
            if(!('caches' in window)) return Promise.resolve();
            return caches.keys().then(function(keys){
                return Promise.all(
                    keys.filter(function(k){
                        return k.indexOf('bk-data-') === 0 && k !== currentBucket;
                    }).map(function(k){ return caches.delete(k); })
                );
            }).catch(function(){});
        }

        // 读/写本地版本
        function getLocalVersion(){ try{return localStorage.getItem(LS_VERSION)||'';}catch(e){return '';} }
        function setLocalVersion(v){ try{localStorage.setItem(LS_VERSION,v);}catch(e){} }

        // 检查远端版本
        function fetchRemoteVersion(){
            return fetch(root + 'version.json?t=' + Date.now(), { cache: 'no-cache' })
                .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .then(function(d){ return (d.version||d.apk_version||''); })
                .catch(function(){ return ''; });
        }

        // 对外：全量安装/更新（带进度回调）
        // mode: 'install' | 'update'
        // version: 可选，调用方可传入远端版本号
        // onProgress(ratio, done, total)
        // 返回 Promise<{ok,total,failed}>
        // 版本号优先级：参数 version > 构建注入 BK_APP_VERSION > fetchRemoteVersion > 本地版本 > '0.0.0'
        // 首次安装：直接写入 bk-data-{version}
        // 更新：写新桶 bk-data-{newVersion}，全量成功后删旧桶——切换桶
        //       中途断网/失败则旧桶完好不动，下次重试
        function install(mode, onProgress, version) {
            // 1. 确定版本号
            var verP;
            if (version) {
                verP = Promise.resolve(version);
            } else if (window.BK_APP_VERSION) {
                verP = Promise.resolve(window.BK_APP_VERSION);
            } else {
                verP = fetchRemoteVersion().then(function(remoteVer){
                    return remoteVer || getLocalVersion() || '0.0.0';
                });
            }
            return verP.then(function(ver){
                var newBucket = dataCacheName(ver);
                var oldBucket = null;
                try { oldBucket = localStorage.getItem(LS_BUCKET) || null; } catch(e) {}

                return cacheFullInto(newBucket, onProgress).then(function(res){
                    if(res.failed > 0) {
                        // 有失败：删新桶，保留旧桶
                        return caches.delete(newBucket).catch(function(){}).then(function(){ return res; });
                    }
                    // 全量成功：记录新桶名和版本号，删旧桶
                    try { localStorage.setItem(LS_BUCKET, newBucket); } catch(e) {}
                    setLocalVersion(ver);
                    if(oldBucket && oldBucket !== newBucket) {
                        return caches.delete(oldBucket).catch(function(){}).then(function(){ return res; });
                    }
                    return res;
                });
            });
        }

        // 对外：启动时检查（PWA standalone 环境）
        // 首次安装自动弹进度框；有新版本时只弹 toast，由用户自主选择是否更新
        // 受"自动检查更新"开关控制：关闭时不在启动时发起网络请求（首次安装除外）
        function checkOnStartup(){
            var isPwa = BK_ENV.isStandalone && !BK_ENV.isCapacitorApp && ('caches' in window);
            if(!isPwa) return;
            var local = getLocalVersion();
            // 非首次安装且关闭自动检查更新时，跳过网络请求
            if(local){
                try { if (localStorage.getItem('bk_auto_check_update') !== '1') return; } catch(e) {}
            }

            fetchRemoteVersion().then(function(remote){
                if(!remote) {
                    // 网络失败时，首次安装用构建注入版本兜底
                    if(window.BK_APP_VERSION && !getLocalVersion()) {
                        showMandatoryInstallDialog('install', window.BK_APP_VERSION);
                    }
                    return;
                }
                var local = getLocalVersion();
                var isFirst = !local;
                var cmpResult = local ? _compareVer(remote, local) : 1;
                if(cmpResult <= 0) return; // 已是最新，静默

                if(isFirst){
                    // 首次安装：自动弹进度框（首次使用必须缓存才能离线）
                    showMandatoryInstallDialog('install', remote);
                } else {
                    // 版本更新：只弹 toast，由用户选择是否更新
                    setTimeout(function(){
                        if(window.AppUpdate && window.AppUpdate.silentCheckUpdate){
                            try{ sessionStorage.removeItem('bk_update_toast_shown'); }catch(e){}
                            window.AppUpdate.silentCheckUpdate();
                        }
                    }, 500);
                }
            }).catch(function(){});
        }

        function _compareVer(a, b){
            var p1=a.replace('v','').split('.').map(Number);
            var p2=b.replace('v','').split('.').map(Number);
            for(var i=0;i<Math.max(p1.length,p2.length);i++){
                var d=(p1[i]||0)-(p2[i]||0);
                if(d!==0) return d>0?1:-1;
            }
            return 0;
        }

        return { install: install, checkOnStartup: checkOnStartup, getLocalVersion: getLocalVersion, setLocalVersion: setLocalVersion, fetchRemoteVersion: fetchRemoteVersion, deleteOldBuckets: deleteOldBuckets };
    })();

    // 兼容：cacheAllBooks 委托给 pwaCache.install（保持旧 API 不破坏调用方）
    function cacheAllBooks(statusEl,onProgress,targetVersion){
        if(!('caches' in window)){if(statusEl)statusEl.textContent='当前环境不支持缓存';return Promise.resolve();}
        var coreUrls=window.__bkCoreUrls||[];
        var totalResources=coreUrls.length;var cachedResources=0;var failedResources=0;
        function rep(){var p=totalResources>0?Math.round(cachedResources/totalResources*100):0;if(onProgress)onProgress(p);return p;}
        // 委托 pwaCache 切换桶安装
        return window.BK.pwaCache.install('install', function(ratio, done, total){
            cachedResources = done; failedResources = 0; rep();
        }, targetVersion).then(function(res){
            failedResources = res.failed || 0; cachedResources = res.ok || 0;
            if(statusEl){statusEl.textContent=failedResources>0?'✓ 缓存完成（'+failedResources+' 个资源失败）':'✓ 全部缓存完成';statusEl.className=failedResources>0?'cache-status':'cache-status success';}
            try{localStorage.setItem('bk_all_cached',Date.now().toString());}catch(e){}
            return res;
        });
    }

    function showMandatoryInstallDialog(mode,targetVersion,onComplete){
        if(document.getElementById('bkInstallMask'))return;
        var icons={install:'📦',update:'🔄'};
        var titles={install:'首次安装缓存',update:'缓存更新中'};
        var subs={install:'首次使用会缓存应用资源，书籍数据按需加载...',update:'正在重新缓存最新资源，用户数据不受影响...'};
        var mask=document.createElement('div');mask.id='bkInstallMask';mask.className='bk-install-mask';
        mask.innerHTML='<div class="bk-install-box"><div class="bk-install-icon">'+icons[mode]+'</div><div class="bk-install-title">'+titles[mode]+'</div><div class="bk-install-sub">'+subs[mode]+'</div><div class="bk-install-progress"><div class="bk-install-progress-bar" id="bkInstallProgressBar"></div></div><div class="bk-install-status" id="bkInstallStatus">正在准备...</div><button class="bk-install-retry" id="bkInstallRetry">重试</button>'+(mode==='update'?'<button class="bk-install-later" id="bkInstallLater" style="display:block;width:100%;margin-top:8px;padding:10px;border:1px solid var(--border,#ddd);border-radius:8px;background:transparent;color:var(--text-secondary,#666);font-size:14px;cursor:pointer">稍后再说</button>':'')+'</div>';
        mask.addEventListener('click',function(e){e.stopPropagation();});
        document.body.appendChild(mask);
        // 防触摸穿透：锁定遮罩滚动
        var _installLockCleanup = (window.BK && window.BK.lockOverlayScroll) ? window.BK.lockOverlayScroll(mask, function(){ mask.remove(); if(_installLockCleanup){_installLockCleanup();_installLockCleanup=null;} }) : null;
        // 统一关闭遮罩（移除 DOM + 释放滚动锁）
        function closeInstall(){
            if(mask.parentNode)mask.parentNode.removeChild(mask);
            if(_installLockCleanup){_installLockCleanup();_installLockCleanup=null;}
        }
        var statusEl=document.getElementById('bkInstallStatus');
        var progressBar=document.getElementById('bkInstallProgressBar');
        var retryBtn=document.getElementById('bkInstallRetry');
        function doInstall(){
            if(retryBtn)retryBtn.style.display='none';
            if(progressBar)progressBar.style.width='0%';
            if(statusEl)statusEl.textContent='开始缓存资源...';
            // 切换桶方案：写新桶 bk-data-{version}，成功后删旧桶
            window.BK.pwaCache.install(mode, function(ratio, done, total){
                var pct = Math.min(Math.round(ratio*100),100);
                if(progressBar)progressBar.style.width=pct+'%';
                if(statusEl)statusEl.textContent='缓存资源：'+pct+'% ('+done+'/'+total+')…';
            }, targetVersion).then(function(res){
                if(progressBar)progressBar.style.width='100%';
                if(statusEl)statusEl.textContent='✓ 下载完成，正在验证...';
                return verifyCacheIntegrity(targetVersion).then(function(result){
                    return {res: res, result: result};
                });
            }).then(function(data){
                var result=data.result;
                if(result.ok){
                    if(onComplete){
                        // ★ 有 onComplete 回调（如 APK 场景 / recache 场景）：
                        //   先展示"完成"状态 800ms 再关闭，让用户看到进度走到 100%，
                        //   避免遮罩瞬间消失（尤其 localhost 缓存极快时）。
                        if(statusEl)statusEl.textContent='✅ 缓存完整，即将完成...';
                        if(progressBar)progressBar.style.width='100%';
                        setTimeout(function(){
                            closeInstall();
                            if(onComplete) onComplete();
                        },800);
                    }else{
                        if(statusEl)statusEl.textContent='✅ 缓存完整，即将重载...';
                        if(progressBar)progressBar.style.width='100%';
                        setTimeout(function(){window.location.reload();},1200);
                    }
                }else{
                    // 缓存不完整时不删旧桶，用户可重试
                    var msg='\u26A0 部分资源未完整\uff08'+Math.round((result.coverage||0)*100)+'%\uff09';
                    if(result.missingCore&&result.missingCore>0){
                        msg+='\n缺少核心资源 '+result.missingCore+' 个';
                        if(result.missingCoreUrls&&result.missingCoreUrls.length)msg+='\uff1a'+result.missingCoreUrls.slice(0,3).map(function(u){return u.split('/').pop();}).join('\u3001')+(result.missingCoreUrls.length>3?'...':'');
                    }
                    msg+='\n请重试';
                    if(statusEl){statusEl.textContent=msg;statusEl.style.whiteSpace='pre-line';}
                    if(retryBtn)retryBtn.style.display='block';
                }
            }).catch(function(err){if(statusEl)statusEl.textContent='\u26A0 出错\uff1a'+(err&&err.message||'未知')+'\uff0c请重试';if(retryBtn)retryBtn.style.display='block';});
        }
        if(retryBtn)retryBtn.addEventListener('click',doInstall);
        var laterBtn=document.getElementById('bkInstallLater');
        if(laterBtn)laterBtn.addEventListener('click',function(){closeInstall();});
        // update 模式：不自动执行，等用户选择"更新"或"稍后"
        if(mode!=='update') doInstall();
    }
    window.showMandatoryInstallDialog=showMandatoryInstallDialog;

    function checkPwaStartupCache(){
        if(window.__bkUpdateInProgress)return;
        // ★ 清理数据后重建缓存：无条件触发安装进度条（跟初次安装一样）
        try{var _recache=sessionStorage.getItem('bk_recache_after_clear')==='1';}catch(e){var _recache=false;}
        if(_recache){
            try{sessionStorage.removeItem('bk_recache_after_clear');}catch(e){}
            // ★ 清除数据后重建缓存：完成后不 reload（已是全新页面），
            //   只关闭遮罩——避免 reload 导致遮罩瞬间消失、用户看不到进度。
            //   首次安装场景仍需 reload（从旧版页面跳转过来），recache 场景不需要。
            function _recacheOnComplete(){
                // 遮罩已由 closeInstall() 关闭，此处仅做收尾（如刷新书架）
                try{var ev=new Event('bk_cache_rebuilt');window.dispatchEvent(ev);}catch(e){}
            }
            fetch('./version.json?t='+Date.now(),{cache:'no-store'})
                .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
                .then(function(v){
                    var ver=v.version||v.apk_version||'dev';
                    showMandatoryInstallDialog('install',ver,_recacheOnComplete);
                })
                .catch(function(){
                    // 离线时无法获取版本，用构建注入 BK_APP_VERSION 兜底，再降级时间戳
                    var ver=(window.BK_APP_VERSION)||Date.now().toString();
                    showMandatoryInstallDialog('install',ver,_recacheOnComplete);
                });
            return;
        }
        if(!BK_ENV.isStandalone||BK_ENV.isCapacitorApp||!('caches' in window))return;
        var storedVersion=null;try{storedVersion=localStorage.getItem('bk_pwa_version');}catch(e){}
        // ★ 首次安装（无本地版本）必须联网建缓存才能离线使用，不受"自动检查更新"门控限制；
        //   非首次（已有缓存）才受 shouldAllowNetworkRequest 控制——符合"关闭时启动不联网"设计。
        if(storedVersion && !(window.BK&&window.BK.shouldAllowNetworkRequest&&window.BK.shouldAllowNetworkRequest()))return;
        fetch('./version.json?t='+Date.now(),{cache:'no-store'})
            .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
            .then(function(v){
                var remoteVersion=v.version||v.apk_version;
                var targetVersion=remoteVersion||storedVersion;
                var versionChanged=remoteVersion&&storedVersion!==remoteVersion;
                if(versionChanged){
                    if(storedVersion){_showPwaUpdateReady();}
                    else{showMandatoryInstallDialog('install',targetVersion);}
                    return;
                }
                verifyCacheIntegrity(storedVersion||undefined)
                    .then(function(result){if(!result.ok){var m=storedVersion?'update':'install';showMandatoryInstallDialog(m,targetVersion);}})
                    .catch(function(){});
            })
            .catch(function(err){
                // 网络失败时，首次安装用构建注入版本兜底
                if(!storedVersion && window.BK_APP_VERSION){
                    showMandatoryInstallDialog('install', window.BK_APP_VERSION);
                } else if(!storedVersion){
                    var b=document.getElementById('bkOfflineBanner');if(b){b.classList.add('show');var d=b.querySelector('.bk-banner-dismiss');if(d)d.addEventListener('click',function(){b.classList.remove('show');});}
                }
            });
    }

    function _showPwaUpdateReady(){
        try{sessionStorage.removeItem('bk_update_toast_shown');}catch(e){}
        if(window.AppUpdate&&window.AppUpdate.silentCheckUpdate){
            window.AppUpdate.silentCheckUpdate();
        } else {
            window.__bkPwaUpdateReady=true;
        }
    }

    // 注册 Service Worker（非 Capacitor 原生环境）
    if('serviceWorker' in navigator){
        var _isNativeApp=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
        if(_isNativeApp){
            // ★ APK 首次打开：内置全部资源数据，无需也不应弹缓存进度框或重建数据桶。
            //   仅静默记录远端版本号（供 APK 更新判断），不做任何缓存。
            //   仍受"自动检查更新"开关控制：关闭时不发起网络请求。
            if('caches' in window){
                var _capVer=null;try{_capVer=localStorage.getItem('bk_pwa_version');}catch(e){}
                if(_capVer && !(window.BK&&window.BK.shouldAllowNetworkRequest&&window.BK.shouldAllowNetworkRequest())){
                    // 关闭自动检查更新且已有版本：跳过联网
                } else {
                    fetch('./version.json?t='+Date.now(),{cache:'no-store'})
                        .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
                        .then(function(v){
                            var _ver=v.version||v.apk_version||'';
                            if(_ver)try{localStorage.setItem('bk_pwa_version',_ver);}catch(e){}
                        })
                        .catch(function(){/* 离线时跳过 */});
                }
            }
        } else {
        navigator.serviceWorker.register('./sw.js').then(function(reg){
            // ★ 仅在开启自动检查更新时主动检查 SW 更新
            if(window.BK&&window.BK.shouldAllowNetworkRequest&&window.BK.shouldAllowNetworkRequest()) reg.update().catch(function(){});
            reg.addEventListener('updatefound',function(){
                var nw=reg.installing;
                if(nw)nw.addEventListener('statechange',function(){
                    if(nw.state==='installed'&&navigator.serviceWorker.controller){

            return navigator.serviceWorker.ready;
        }).then(function(){checkPwaStartupCache();}).catch(function(e){console.error('[SW]',e);});
        var refreshing=false;
        navigator.serviceWorker.addEventListener('controllerchange',function(){
            if(refreshing)return;
            if(window.__bkUpdateInProgress)return;
            if(window.__bkSwRefreshing)return;
            var isNative=!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
            if(isNative)return;
            refreshing=true;window.location.reload();
        });
        } // end else (non-native)
    }

    // 主页 PWA/清理功能委托（供 theme-toggle.js 调用）

    function clearAllCachesAndMemory(opts){
        opts=opts||{};
        var goHome=function(){

            try{localStorage.removeItem('bk_highlights');}catch(e){}
            try{localStorage.removeItem('bk_highlights_bak');}catch(e){}
            var lf=(typeof localforage!=='undefined')?localforage.createInstance({name:'books',storeName:'highlights'}):null;
            (lf?lf.clear():Promise.resolve()).then(goHome).catch(goHome);
            return;
        }
        var steps=[];
        steps.push(new Promise(function(resolve){try{var keys=[];for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('bk_')&&k!=='bk_first_use')keys.push(k);else if(k&&k.startsWith('bk-'))keys.push(k);if(k==='fontSize'||k==='globalFontSize'||k==='readingTheme'||k==='speechRate')keys.push(k);}keys.forEach(function(k){localStorage.removeItem(k);});resolve();}catch(e){resolve();}}));
        steps.push(new Promise(function(resolve){try{sessionStorage.clear();resolve();}catch(e){resolve();}}));
        if('serviceWorker' in navigator)steps.push(navigator.serviceWorker.getRegistrations().then(function(regs){return Promise.all(regs.map(function(r){return r.unregister();}));}).catch(function(){}));
        if('caches' in window)steps.push(caches.keys().then(function(keys){return Promise.all(keys.map(function(k){return caches.delete(k);}));}).catch(function(){}));
        if('indexedDB' in window)steps.push(new Promise(function(resolve){try{var dbs=['books','bk-cache','workbook-expiration','localforage'];Promise.all(dbs.map(function(n){return new Promise(function(r){var req=indexedDB.deleteDatabase(n);req.onsuccess=req.onerror=r;req.onblocked=function(){/* 阻塞时延迟重试一次 */setTimeout(function(){var req2=indexedDB.deleteDatabase(n);req2.onsuccess=req2.onerror=req2.onblocked=r;},500);};});})).then(resolve);}catch(e){resolve();}}));
        if(typeof localforage!=='undefined')steps.push(localforage.clear().catch(function(){}));
        Promise.all(steps).then(goHome);
    }

    // 主页 PWA 安装功能委托（供 theme-toggle.js 调用）
    document.addEventListener('DOMContentLoaded',function(){
        window.BK.installPWA=function(){
            var p=window._pwaInstallPrompt;if(!p)return;
            window._pwaInstallPrompt=null;p.prompt();
        };
    });
    </script>

    <!-- ── 启动 SPA 路由器 ────────────────────────────────────────────── -->
    <script>
    (function waitRenderer(){
        if(window.BKRenderer){
            // renderChapterList / renderReadingView 需要先切到 SPA 视图容器
            ['renderChapterList','renderReadingView'].forEach(function(fn){
                var orig=window.BKRenderer[fn];
                window.BKRenderer[fn]=function(){
                    window._bkShowApp();
                    return orig.apply(window.BKRenderer,arguments);
                };
            });
        }
        if(window.BKRouter){
            window.BKRouter.start();
        } else {
            document.addEventListener('DOMContentLoaded',function(){
                if(window.BKRouter)window.BKRouter.start();
            });
        }
    })();
    </script>
    <!-- 阅读进度条 JS -->
    <script>
    (function(){
        var prog=document.getElementById('bkReadingProgress');
        if(prog){
            function updProg(){
                // 阅读视图由 renderer 模块按章节进度+章内滚动综合更新，此处不介入
                if(document.body.classList.contains('bk-reading-page')) return;
                var s=window.scrollY||0;
                var d=document.documentElement.scrollHeight-window.innerHeight;
                prog.style.width=(d>0?Math.min(100,s/d*100):0)+'%';
            }
            window.addEventListener('scroll',updProg,{passive:true});
            window.addEventListener('hashchange',function(){
                // 切换路由后：阅读页由 renderer 重置；非阅读页清零交回 window 滚动逻辑
                if(!document.body.classList.contains('bk-reading-page')){
                    prog.style.width='0%';
                    setTimeout(updProg,50);
                }
            });
        }
    })();
    </script>
