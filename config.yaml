# 通用批量处理配置
batch_processing:
  enabled: true
  skip_existing: false
  strict_exit_on_batch_failure: false  # false: 部分失败也返回0；true: 只要有失败就返回1
  max_latest_books: 5  # GitHub 打包最多保留最新 N 本书
  # specific_books: []  # 注释掉此行，默认处理所有可用书籍

# 全局配置
output_dir: "output"
resource_base_dir: "resource"
template_dir: "src/templates"
static_dir: "src/static"

# 伪装/访问控制：是否开启「请下载APK」伪装页
# false（默认）= 关闭，普通浏览器直接可用；true = 开启（非 App/PWA 访问显示伪装页）
# 也可通过 URL 参数 ?disguise=1 临时开启自测，覆盖此配置
disguise_enabled: false

# 默认书籍配置（可选，仅当无法从文件夹名自动识别时使用）
# 程序会自动从文件夹名称提取书名和作者信息
default_book:
  year: 2025  # 后备年份

# 远程服务器地址（main.py 读取后生成 output/js/remote-config.js，URL 以 base64 存储并混淆）
remote_servers:
  cloudflare:
    # ── 账户1 域名 ──
    - https://books.zhaozg.dpdns.org/
    - https://books.zhaozg.cloudns.org/
    - https://books.07170501.xyz/
    - https://books.1189.dpdns.org/
    # ── 账户2 域名（待配置，部署时在 deploy.yml matrix.domains 中同步添加） ──
    # - https://books2.example.com/
  github_api: https://api.github.com/repos/zhao-zg/books/releases/latest
  github_mirrors:
    - https://gh-proxy.com/
    - https://ghproxy.net/
    - https://proxy.11891189.xyz/
    - https://proxy.07170501.xyz/
  push:
    - https://moepush.zhaozg.cloudns.org/api/push/Xd1q23D8VNuxB6wz
    - https://moepush.zhaozg.dpdns.org/api/push/Xd1q23D8VNuxB6wz
  ip_apis:
    - https://myip.ipip.net
    - https://ipinfo.io/json

# 赞助功能开关（true=启用顾念微工，false=完全不加载）
sponsor_enabled: true

# 下载竞速测速文件配置
# 构建时生成指定大小的测速文件，部署到 CF 后供 APK 下载竞速使用
speedtest:
  size_kb: 200          # 测速文件大小（KB），越大测速越准但耗时越长
  filename: "speedtest.bin"  # 测速文件名
  timeout_per_kb: 20    # 每 KB 超时(ms)，总超时 = size_kb × timeout_per_kb（200KB=4s）
  fast_enough_ms: 1000  # 下载耗时≤此值时认为够快，跳过剩余服务器（200KB约2s）

# WebDAV 预置服务器（可选，由 config.yaml 配置，随构建产物下发；用户不可删除）
# 用途：让打包者内置常用 WebDAV 服务器，普通用户开箱即用，无需手动填写。
# 字段说明：
#   name     ：服务器显示名称（必填）
#   url      ：WebDAV 地址（必填，如 https://server/dav）；多域名可改用下方 urls
#   urls     ：多域名列表（可选），连接时并发探测、自动选最快可达节点。
#             配置 urls 后 url 可省略（取 urls[0]）；二者都给时以 urls 为准。
#   username ：登录用户名（可选）
#   password ：登录密码（可选；明文写入产物，建议仅在私有/可信构建中使用）
#   note     ：备注说明，会显示在导入界面服务器选择器下方（可选）
#   authType ：认证类型，basic（默认）/ token（Bearer）；digest 预留
# 注：url/username/password 会在产物中经 base64 编码，note 为明文展示文本。
webdav:
  presets:
    - name: "2期追求"
      urls:
         - "https://webdav2.11891189.xyz/dav/zqs"
         - "https://webdav.zhf.dpdns.org/dav/zqs"
         - "https://webdav.11891189.xyz/dav/zqs"
      username: "zqs"
      password: "zqs"
      startPath: "2区使用"
      note: "个人维护书籍，请勿滥用"
      authType: basic
    # 示例：多域名（自动选最快节点）
    # - name: "多节点书库"
    #   urls:
    #     - "https://node-a.example.com/dav"
    #     - "https://node-b.example.com/dav"
    #   username: "user"
    #   password: "pass"
    #   note: "境内外多节点，自动择优"
    #   authType: basic
